<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vaylee - Adopt Me Trading</title>

    <!-- Zeyada font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zeyada&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f2ff;
            color: #3d3450;
        }

        /* NAVIGATION */

        header {
            background: white;
            height: 80px;
            padding: 0 50px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow: 0 2px 15px rgba(100, 70, 150, 0.12);
        }

        .logo {
            font-family: "Zeyada", cursive;
            font-size: 52px;
            color: #9b7bc7;
            line-height: 1;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: #665578;
            font-weight: 600;
            transition: 0.2s;
        }

        nav a:hover {
            color: #9b7bc7;
        }

        /* HERO */

        .hero {
            min-height: calc(100vh - 80px);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 40px 20px;
        }

        .hero h1 {
            font-family: "Zeyada", cursive;
            font-size: 72px;
            font-weight: normal;
            color: #8d6bb8;
            margin: 0;
        }

        .hero p {
            font-size: 19px;
            max-width: 600px;
            line-height: 1.6;
            color: #70647d;
            margin: 10px 0 35px;
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .button {
            display: inline-block;

            padding: 14px 28px;

            border-radius: 12px;

            background: #9b7bc7;
            color: white;

            text-decoration: none;
            font-weight: bold;
            font-size: 16px;

            transition: 0.2s;
        }

        .button:hover {
            background: #8564b0;
            transform: translateY(-2px);
        }

        .button.secondary {
            background: white;
            color: #8d6bb8;
            border: 2px solid #b69bd8;
        }

        .button.secondary:hover {
            background: #f0e8fb;
        }

    </style>
</head>

<body>

    <header>

        <div class="logo">
            Vaylee
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="listings.html">Listings</a>
            <a href="pets.html">Browse Pets</a>
        </nav>

    </header>


    <main class="hero">

        <h1>Vaylee</h1>

        <p>
            Find trades, discover pets, and connect with other Adopt Me players.
        </p>

        <div class="buttons">

            <a class="button" href="listings.html">
                View Listings
            </a>

            <a class="button secondary" href="pets.html">
                Browse Pets
            </a>

            <a class="button secondary" href="make-listing.html">
                Make Listing
            </a>

        </div>

    </main>

</body>
</html>
