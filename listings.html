<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vaylee - Listings</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@800&family=Lilita+One&family=Zeyada&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5efff;
            color: #493c59;

            font-family: "Dosis", sans-serif;
            font-weight: 800;
        }

        /* HEADER */

        header {
            height: 82px;
            background: rgba(255, 255, 255, 0.96);

            padding: 0 45px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow: 0 4px 20px rgba(110, 75, 160, 0.12);

            position: sticky;
            top: 0;
            z-index: 100;
        }

        /* VAYLEE LOGO */

        .logo {
            font-family: "Zeyada", cursive;
            font-size: 55px;
            font-weight: normal;
            color: #9672c2;

            text-decoration: none;

            line-height: 1;

            transition: 0.2s;
        }

        .logo:hover {
            transform: scale(1.04);
        }

        /* NAVIGATION */

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #655675;
            text-decoration: none;
            font-size: 17px;

            transition: 0.2s;
        }

        nav a:hover {
            color: #9672c2;
        }

        /* PAGE */

        .page {
            width: min(1200px, 92%);
            margin: auto;
            padding: 55px 0 80px;
        }

        .page-title {
            font-family: "Lilita One", cursive;
            font-size: 48px;
            font-weight: normal;

            text-align: center;

            color: #8262aa;

            margin: 0;
        }

        .subtitle {
            text-align: center;
            font-size: 18px;
            color: #776883;

            margin: 8px 0 45px;
        }

        /* LISTING CARD */

        .listing {
            background: white;

            border-radius: 24px;

            padding: 25px;

            margin-bottom: 30px;

            box-shadow:
                0 8px 30px rgba(105, 75, 145, 0.12);

            border: 1px solid #eadff7;
        }

        .listing-top {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .listing-title {
            font-size: 21px;
            color: #554563;
        }

        .listing-user {
            color: #a083c6;
            font-size: 16px;
        }

        /* TRADE AREA */

        .trade {
            display: grid;

            grid-template-columns: 1fr 60px 1fr;

            gap: 18px;

            align-items: center;
        }

        /* OFFER BOX */

        .offer {
            background: #f8f4ff;

            border: 2px solid #eadff7;

            border-radius: 20px;

            padding: 20px;

            min-height: 230px;
        }

        .offer-title {
            font-family: "Lilita One", cursive;
            font-size: 25px;
            font-weight: normal;

            color: #8564ae;

            margin-bottom: 18px;

            text-align: center;
        }

        /* PET GRID */

        .pets {
            display: grid;

            grid-template-columns: repeat(5, 1fr);

            gap: 12px;

            max-height: 240px;

            overflow-y: auto;

            padding: 5px;
        }

        /* PET */

        .pet {
            position: relative;

            min-width: 85px;
            height: 85px;

            background: white;

            border-radius: 16px;

            border: 2px solid #e7daf4;

            display: flex;

            align-items: center;
            justify-content: center;

            cursor: pointer;

            transition: 0.2s;
        }

        .pet:hover {
            transform: translateY(-4px);

            border-color: #b99bd7;

            box-shadow: 0 5px 15px rgba(130, 95, 170, 0.18);
        }

        .pet-emoji {
            font-size: 43px;
        }

        /* PET TOOLTIP */

        .pet-info {
            position: absolute;

            bottom: calc(100% + 8px);

            left: 50%;

            transform: translateX(-50%);

            width: 130px;

            padding: 8px;

            border-radius: 10px;

            background: #4c4058;

            color: white;

            text-align: center;

            font-size: 14px;

            opacity: 0;

            pointer-events: none;

            transition: 0.15s;

            z-index: 20;
        }

        .pet:hover .pet-info {
            opacity: 1;
        }

        /* PLUS BUTTON */

        .add-pet {
            min-width: 85px;
            height: 85px;

            border-radius: 16px;

            border: 2px dashed #b99bd7;

            background: #fbf9ff;

            color: #a083c6;

            font-size: 38px;

            cursor: pointer;

            transition: 0.2s;
        }

        .add-pet:hover {
            background: #f0e7fb;

            transform: translateY(-3px);
        }

        /* ARROW */

        .trade-arrow {
            width: 55px;
            height: 55px;

            border-radius: 50%;

            background: #eee3fa;

            color: #8c6ab6;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 27px;
        }

        /* VIEW TRADE */

        .view-trade {
            display: block;

            margin: 22px auto 0;

            padding: 12px 30px;

            border: none;

            border-radius: 12px;

            background: #9672c2;

            color: white;

            font-family: "Dosis", sans-serif;
            font-weight: 800;

            font-size: 17px;

            cursor: pointer;

            transition: 0.2s;
        }

        .view-trade:hover {
            background: #805cae;

            transform: translateY(-2px);
        }

        /* DECORATION */

        .sparkle {
            position: fixed;

            font-size: 22px;

            opacity: 0.35;

            pointer-events: none;
        }

        .sparkle.one {
            top: 150px;
            left: 5%;
        }

        .sparkle.two {
            top: 350px;
            right: 6%;
        }

        .sparkle.three {
            bottom: 100px;
            left: 8%;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            header {
                padding: 0 20px;
            }

            nav {
                gap: 12px;
            }

            nav a {
                font-size: 14px;
            }

            .trade {
                grid-template-columns: 1fr;
            }

            .trade-arrow {
                margin: auto;

                transform: rotate(90deg);
            }

            .pets {
                grid-template-columns: repeat(4, 1fr);
            }

        }

    </style>
</head>


<body>

    <!-- HEADER -->

    <header>

        <!-- Clicking Vaylee returns home -->

        <a href="index.html" class="logo">
            Vaylee
        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="listings.html">
                Listings
            </a>

            <a href="pets.html">
                Browse Pets
            </a>

        </nav>

    </header>


    <!-- DECORATIVE SPARKLES -->

    <div class="sparkle one">✦</div>
    <div class="sparkle two">✧</div>
    <div class="sparkle three">✦</div>


    <!-- PAGE -->

    <main class="page">

        <h1 class="page-title">
            View Listings
        </h1>

        <p class="subtitle">
            Find trades from other Adopt Me players.
        </p>


        <!-- EXAMPLE LISTING -->

        <div class="listing">

            <div class="listing-top">

                <div class="listing-title">
                    Looking for a good trade!
                </div>

                <div class="listing-user">
                    @ExampleUser
                </div>

            </div>


            <div class="trade">


                <!-- YOUR OFFER -->

                <div class="offer">

                    <div class="offer-title">
                        Your Offer
                    </div>

                    <div class="pets">


                        <div class="pet">

                            <span class="pet-emoji">
                                🦄
                            </span>

                            <div class="pet-info">
                                Unicorn<br>
                                Ultra-Rare
                            </div>

                        </div>


                        <div class="pet">

                            <span class="pet-emoji">
                                🐶
                            </span>

                            <div class="pet-info">
                                Dog<br>
                                Common
                            </div>

                        </div>


                        <div class="pet">

                            <span class="pet-emoji">
                                🐱
                            </span>

                            <div class="pet-info">
                                Cat<br>
                                Common
                            </div>

                        </div>


                        <!-- ADD PET -->

                        <button class="add-pet">
                            +
                        </button>


                    </div>

                </div>


                <!-- ARROW -->

                <div class="trade-arrow">
                    →
                </div>


                <!-- THEIR OFFER -->

                <div class="offer">

                    <div class="offer-title">
                        Their Offer
                    </div>

                    <div class="pets">


                        <div class="pet">

                            <span class="pet-emoji">
                                🐉
                            </span>

                            <div class="pet-info">
                                Bat Dragon<br>
                                Legendary
                            </div>

                        </div>


                        <div class="pet">

                            <span class="pet-emoji">
                                🦊
                            </span>

                            <div class="pet-info">
                                Red Fox<br>
                                Uncommon
                            </div>

                        </div>


                        <div class="pet">

                            <span class="pet-emoji">
                                🐰
                            </span>

                            <div class="pet-info">
                                Rabbit<br>
                                Rare
                            </div>

                        </div>


                    </div>

                </div>

            </div>


            <button class="view-trade">
                View Trade
            </button>

        </div>


    </main>

</body>
</html>
